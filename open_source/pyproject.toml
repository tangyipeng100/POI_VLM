[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-vlm"
version = "0.1.0"
description = "Polygon-based point-of-interest generation for interpretable local navigation evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "POI-VLM authors"}]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["poi_core"]
